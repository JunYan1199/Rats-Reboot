plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.54' }
version = '1.20.1-8.1.3-reborn-merged.1-path.1'
group = 'com.github.alexthe666.rats'
base { archivesName = 'Rats-Reboot-Forge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
 mappings channel: 'official', version: '1.20.1'
 accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
 runs {
 configureEach { args '--mixin','rats.mixins.json'; property 'mixin.env.remapRefMap','true'; property 'mixin.env.refMapRemappingFile',file('build/createSrgToMcp/output.srg').absolutePath }
  server { property 'rats.smokeTest','true'; workingDirectory project.file(project.hasProperty('minimalTest') ? 'run-server-minimal' : 'run-server'); args '--nogui'; mods { rats { source sourceSets.main } } }
  client { args '--quickPlaySingleplayer','merged-ui-test'; args '--username','RatsMergeTest','--width','1280','--height','800'; property 'rats.uiTest','true'; workingDirectory project.file('run-client'); mods { rats { source sourceSets.main } } }
  gameTestServer { workingDirectory project.file('run-test'); property 'forge.enabledGameTestNamespaces','rats'; mods { rats { source sourceSets.main } } }
 }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories { maven { url = uri('local-maven') }; mavenCentral(); maven { url 'https://maven.minecraftforge.net' }; maven { url 'https://repo.spongepowered.org/repository/maven-public/' } }
dependencies {
 compileOnly fileTree(dir:'libs/create-api',include:['*.jar'])
 compileOnly files('libs/rsi/rs_integration-1.6.0.jar')
 compileOnly fileTree(dir: providers.gradleProperty('ratSpellApiDir').getOrElse('libs/spell-api'), include: ['*goety-2.*.jar','*irons_spellbooks-1.20*.jar','*curios-forge*.jar','*榛勬槒-*.jar','goety-iron-twilight-api.jar'])
 minecraft 'net.minecraftforge:forge:1.20.1-47.4.29'
 implementation fg.deobf('local.rats:dep0:1')
 if (project.hasProperty('minimalTest')) { compileOnly fg.deobf('local.rats:dep1:1') } else { implementation fg.deobf('local.rats:dep1:1') }
 if (project.hasProperty('minimalTest')) { compileOnly fg.deobf('local.rats:dep2:1') } else { implementation fg.deobf('local.rats:dep2:1') }
 if (project.hasProperty('minimalTest')) { compileOnly fg.deobf('local.rats:dep3:1') } else { implementation fg.deobf('local.rats:dep3:1') }
 if (project.hasProperty('minimalTest')) { compileOnly fg.deobf('local.rats:dep4:1') } else { implementation fg.deobf('local.rats:dep4:1') }
 
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.compilerArgs += ['-Xmaxerrs','300','-Xlint:-removal','-proc:none'] }
jar { from('LICENSE'); from('MERGE-NOTICE.txt'); from('JANE-DOE-CREDITS.txt'); exclude 'com/github/alexthe666/rats/test/**'; manifest { attributes 'MixinConfigs':'rats.mixins.json,rats.rsi.mixins.json', 'Implementation-Version':project.version, 'Implementation-Title':'Rats: Reboot' }; finalizedBy 'reobfJar' }

processResources { exclude 'data/minecraft/datapacks/ratlantis/**' }

tasks.named('jar') { archiveFileName = 'Rats-Reboot-Forge-1.20.1-8.1.3-fieldguide.1.jar' }
